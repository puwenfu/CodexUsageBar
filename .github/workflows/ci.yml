name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CodexUsageBar.sln

      - name: Build
        run: dotnet build CodexUsageBar.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CodexUsageBar.sln --configuration Release --no-build --verbosity minimal

      - name: Prepare Pester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'Pester.4.10.1.zip'
          $moduleRoot = Join-Path $env:RUNNER_TEMP 'Pester-4.10.1'
          Invoke-WebRequest `
            -Uri 'https://www.powershellgallery.com/api/v2/package/Pester/4.10.1' `
            -OutFile $package
          $actualHash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash
          $expectedHash = '898210E1A30C52CD46BA317C2278A9324345214213AA2F7D6B7DFA7B98F37AC9'
          if ($actualHash -cne $expectedHash) {
            throw "Pester package hash mismatch: $actualHash"
          }
          Expand-Archive -LiteralPath $package -DestinationPath $moduleRoot
          $manifest = Join-Path $moduleRoot 'Pester.psd1'
          "PESTER_MANIFEST=$manifest" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test release helpers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Import-Module $env:PESTER_MANIFEST -Force -ErrorAction Stop
          if ((Get-Module Pester).Version -ne [version]'4.10.1') {
            throw 'Wrong Pester version loaded.'
          }
          Invoke-Pester -Path '.\\tests\\PublishSupport.Tests.ps1' -EnableExit

      - name: Test release workflow
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          Import-Module $env:PESTER_MANIFEST -Force -ErrorAction Stop
          if ((Get-Module Pester).Version -ne [version]'4.10.1') {
            throw 'Wrong Pester version loaded.'
          }
          Invoke-Pester -Path '.\\tests\\PublishScript.Tests.ps1' -EnableExit

      - name: Validate release inputs
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\publish.ps1 -WhatIfValidation

      - name: Build release candidate
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\publish.ps1

      - name: Upload release candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: CodexUsageBar-release-candidate
          path: |
            dist/*/*_win-x64.zip
            dist/*/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
