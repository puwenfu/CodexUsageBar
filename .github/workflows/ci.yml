name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CodexUsageBar.sln

      - name: Build
        run: dotnet build CodexUsageBar.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CodexUsageBar.sln --configuration Release --no-build --verbosity minimal

      - name: Install Pester
        shell: powershell
        run: Install-Module Pester -RequiredVersion 4.10.1 -Force -Scope CurrentUser

      - name: Test release helpers
        shell: powershell
        run: Invoke-Pester -Path '.\\tests\\PublishSupport.Tests.ps1'

      - name: Test release workflow
        shell: powershell
        run: Invoke-Pester -Path '.\\tests\\PublishScript.Tests.ps1'
